# Basiskonfiguration des KI-Agenten.
# Jeder Wert kann per Environment überschrieben werden:
#   AGENT_<FELD> bzw. AGENT_<GRUPPE>__<FELD>, z. B. AGENT_DATABASE__URL
# Secrets gehören NICHT in diese Datei, sondern in .env / Environment.

app_name: ki-agent-it-auftraege
environment: development

database:
  url: sqlite:///data/agent.db
  echo: false

logging:
  level: INFO
  format: json   # json | text

# Deterministisches Scoring (docs/requirements.md, Abschnitt 8)
scoring:
  # Maximalpunkte je Kriterium, Summe muss 100 ergeben
  weights:
    scope: 20             # Scope klein/klar
    deliverability: 15    # fachlich/technisch lieferbar
    win_probability: 20   # Abschlusswahrscheinlichkeit/geringe Zugangshürden
    budget_effort: 15     # Budget-/Aufwand-Verhältnis
    direct_customer: 10   # direkter Kunde/KMU/kurze Entscheidung
    remote_fit: 5         # Remote/geografischer Fit
    urgency: 5            # Dringlichkeit
    follow_up: 5          # Folgepotenzial
    consulting_fit: 5     # strategischer Beratungsfit
  # Untergrenzen (inklusive); darunter REJECT
  thresholds:
    a: 80
    b: 65
    c: 50
  # Anteil der Maximalpunkte für unbekannte Merkmale
  unknown_fraction: 0.4
  hard_fail:
    available_certifications: []   # z. B. ["ISTQB Foundation", "Scrum Master"]
    has_security_clearance: false
    onsite_allowed_regions: [dach]
    max_person_days: 60
    max_must_have_requirements: 15
    min_day_rate_eur: 300
  scope:
    target_person_days_min: 1
    target_person_days_max: 20
    stretch_person_days_max: 40
    must_have_soft_limit: 8        # darüber Abzug bei Abschlusswahrscheinlichkeit
  budget:
    target_day_rate_eur: 800
    acceptable_day_rate_eur: 600
    hours_per_day: 8
    first_order_min_eur: 1000
    first_order_max_eur: 15000
    currency_rates_to_eur:         # statische Näherungswerte, bei Bedarf anpassen
      EUR: 1.0
      CHF: 1.05
      USD: 0.92
      GBP: 1.17

# Quellen. Jeder Connector ist isoliert; Fehler einer Quelle stoppen andere nicht.
sources:
  email:
    enabled: true
    mailbox_dir: data/inbox          # Offline-Postfach mit .eml-Dateien (IMAP folgt später)
    unknown_sender_policy: skip      # skip | generic (ganze Mail als ein Eintrag)
    unknown_source_name: email_unknown
    generic_link_texts:              # Linktexte, die nicht als Projekttitel taugen
      - projekt ansehen
      - zum projekt
      - details
      - mehr erfahren
      - mehr
      - jetzt bewerben
      - view project
    # Parserprofile; Muster sind reguläre Ausdrücke (case-insensitiv).
    # Layout link_start: Block beginnt mit dem Projektlink; link_end: Block endet mit ihm.
    profiles:
      - name: freelancermap
        sender_patterns: ['@(mail\.)?freelancermap\.(de|com|at|ch)$']
        project_url_patterns: ['^https?://(www\.)?freelancermap\.(de|com|at|ch)/projekt/[^/?#]+']
        project_id_pattern: '-(\d+)(?:[/?#]|$)'
        html_layout: link_start
        text_layout: link_start
        footer_markers: ['Sie erhalten diese E-Mail']
      - name: freelance.de
        sender_patterns: ['@(mail\.)?freelance\.de$']
        project_url_patterns: ['^https?://(www\.)?freelance\.de/projekte/projekt-\d+']
        project_id_pattern: 'projekt-(\d+)'
        html_layout: link_start
        text_layout: link_end
        content_start_markers: ['Projekte? gefunden[^\n]*\n']
        footer_markers: ['Projektalarm verwalten']

# LLM-Analyse. Das LLM extrahiert nur Merkmale; der Score wird deterministisch berechnet.
# API-Key ausschließlich per Environment (ANTHROPIC_API_KEY), nie in dieser Datei.
llm:
  provider: anthropic          # anthropic | fake (offline, ohne API-Key)
  model: claude-opus-5-5
  effort: medium               # low | medium | high | xhigh | max
  max_output_tokens: 16000
  timeout_seconds: 120
  max_attempts: 3              # Versuche je Lead, nur bei technischen/strukturellen Fehlern
  retry_backoff_seconds: 2.0
  max_input_chars: 20000       # längere Auftragstexte werden gekürzt (mit Hinweis)
  refusal_fallback: false      # true = server-seitiger Wechsel auf anderes Modell bei Ablehnung
  pricing:                     # USD je 1 Mio. Tokens, nur für Kostenschätzung im Log
    input_per_mtok: 4.0
    output_per_mtok: 20.0
  analyst_profile: |
    Freelancer für Softwareentwicklung, IT und Digitalisierung (DACH, deutsch- und englischsprachig).
    Schwerpunkte: Python, SQL/Datenbanken, APIs und Schnittstellen, Automatisierung, interne Tools und
    Dashboards, Web/Shop-Erweiterungen, Android/Desktop, MVP/PoC, Weiterentwicklung bestehender Systeme.
    Beratung für KMU: Prozessdigitalisierung, Anforderungen, Lösungsdesign, Softwareauswahl, KI-Einsatz.
    Bevorzugt: kleine, klar abgegrenzte Aufträge (ca. 1–20 Personentage), direkte Auftraggeber, remote.
