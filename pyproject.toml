[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-agent-it-auftraege"
version = "0.1.0"
description = "KI-Agent, der passende kleine IT-Freelancer- und Beratungsaufträge findet, bewertet und per HTML-E-Mail meldet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "SQLAlchemy>=2.0,<3",
    "PyYAML>=6.0",
    "anthropic>=1.11,<2",
    "Jinja2>=3.1,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.report" = ["templates/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
